jobs:
  validate-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run PSScriptAnalyzer on PowerShell scripts
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -RequiredVersion '1.23.0' -Force -Scope CurrentUser
          Import-Module PSScriptAnalyzer -RequiredVersion '1.23.0'
          $results = Invoke-ScriptAnalyzer -Path .\core, .\diagnostics -Recurse -Severity Error, Warning
          if ($results) {
            $results | Format-Table -AutoSize
          }
          $errors = $results | Where-Object { $_.Severity -eq 'Error' }
          if ($errors) {
            throw "PSScriptAnalyzer found $($errors.Count) error(s)."
          }

      - name: Run Pester Test Calling Shared SecurityValidation.psm1
        shell: pwsh
        run: |
          Import-Module .\core\SecurityValidation.psm1 -Force

          $mask = Get-WriteRightsMask
          Write-Host "Active WriteRightsMask: 0x$($mask.ToString('X'))"

          $ReadAndExecute = 0x1200A9
          if (($ReadAndExecute -band $mask) -ne 0) {
            throw "FATAL: ReadAndExecute (0x1200A9) overlap with WriteRightsMask must be 0."
          }

          $R = [System.Security.AccessControl.FileSystemRights]
          $SidSystem = New-Object System.Security.Principal.SecurityIdentifier('S-1-5-18')
          $SidAdmins = New-Object System.Security.Principal.SecurityIdentifier('S-1-5-32-544')
          $SidUsers  = New-Object System.Security.Principal.SecurityIdentifier('S-1-5-32-545')

          # 1. Test standard locked-down ACL: must pass cleanly
          $sec = New-Object System.Security.AccessControl.DirectorySecurity
          $sec.SetOwner($SidAdmins)
          $sec.SetAccessRuleProtection($true, $false)
          $sec.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule($SidSystem, $R::FullControl, 3, 0, 'Allow')))
          $sec.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule($SidAdmins, $R::FullControl, 3, 0, 'Allow')))
          $sec.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule($SidUsers,  $R::ReadAndExecute, 3, 0, 'Allow')))

          $res1 = Test-SafeDirectoryAcl -DirectoryAcl $sec -PathDescription "StandardLockedDir"
          if (-not $res1.Success) {
            throw "Test failed: standard locked ACL was rejected: $($res1.Error)"
          }
          Write-Host "PASS: Standard locked ACL passed Test-SafeDirectoryAcl."

          # 2. Test untrusted owner: must fail
          $secOwnerFail = New-Object System.Security.AccessControl.DirectorySecurity
          $secOwnerFail.SetOwner($SidUsers)
          $resOwner = Test-SafeDirectoryAcl -DirectoryAcl $secOwnerFail -PathDescription "UntrustedOwnerDir"
          if ($resOwner.Success) {
            throw "Test failed: untrusted owner was not caught."
          }
          Write-Host "PASS: Untrusted owner correctly rejected."

          # 3. Test unauthorized write rule: must fail
          $secWriteFail = New-Object System.Security.AccessControl.DirectorySecurity
          $secWriteFail.SetOwner($SidAdmins)
          $secWriteFail.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule($SidUsers, $R::WriteData, 3, 0, 'Allow')))
          $resWrite = Test-SafeDirectoryAcl -DirectoryAcl $secWriteFail -PathDescription "UnauthorizedWriteDir"
          if ($resWrite.Success) {
            throw "Test failed: unauthorized WriteData rule was not caught."
          }
          Write-Host "PASS: Unauthorized WriteData rule correctly rejected."

      - name: Compile C# WinForms GUI with .NET Framework csc.exe
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /optimize+ /out:RobloxTouchSwitch.exe `
            /reference:System.dll `
            /reference:System.Core.dll `
            /reference:System.Drawing.dll `
            /reference:System.Management.dll `
            /reference:System.Runtime.Serialization.dll `
            /reference:System.Xml.dll `
            /reference:System.Windows.Forms.dll `
            /win32icon:assets\RobloxTouchSwitch.ico `
            core\RobloxTouchSwitchApp.cs
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path .\RobloxTouchSwitch.exe)) {
            throw "C# compilation failed."
          }
          Write-Host "Successfully compiled RobloxTouchSwitch.exe ($((Get-Item .\RobloxTouchSwitch.exe).Length) bytes)"
